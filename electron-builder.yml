appId: com.lovexjy.lexinote
productName: LexiNote
copyright: Copyright © 2026 LexiNote
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
  - '!**/*.map'
  - '!node_modules/**'
asar: true
compression: normal
win:
  icon: build/icon.ico
  executableName: LexiNote
  target:
    - nsis
    - zip
  artifactName: ${productName}-${version}-windows-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 知萤 LexiNote
  buildUniversalInstaller: false
  installerLanguages:
    - zh_CN
    - en_US
  language: '2052'
  uninstallDisplayName: 知萤 LexiNote
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

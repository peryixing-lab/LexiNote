<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <!--
    Strict CSP for the plugin runtime page.

    - default-src 'none' blocks every implicit resource type (network, images, fonts,
      media, frames, workers, manifests).
    - script-src allows only the locally bundled runtime.bundle.js and `new Function`
      (used by the CommonJS loader), plus inline script for host-injected boot code.
      `file://` covers the DevEco/rawfile asset origin; `resource://rawfile` is the
      ArkWeb rawfile scheme on device.
    - connect-src stays under default-src 'none': the runtime never performs network I/O.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self' 'unsafe-eval' 'unsafe-inline' file:// resource://rawfile; style-src 'self' 'unsafe-inline'; img-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>LexiNote Plugin Runtime</title>
<style>
:root { color-scheme: light dark; --font-text-size: 14px; --font-interface: sans-serif; --text-normal: #343139; --text-muted: #827b87; --text-faint: #aaa4ae; --text-accent: #807397; --text-error: #d34b66; --background-primary: #f7f5f8; --background-secondary: #eeeaf1; --background-modifier-border: #e1dce6; --interactive-accent: #8c7eab; --interactive-normal: #eeeaf1; }
@media(prefers-color-scheme: dark) { :root { --text-normal:#ded8e6; --text-muted:#aaa1b5; --background-primary:#25212b; --background-secondary:#302b38; --background-modifier-border:#453e4f; --interactive-normal:#39323f; } }
* { box-sizing:border-box; } html,body { margin:0; width:100%; height:100%; color:var(--text-normal); background:var(--background-primary); font:14px/1.5 sans-serif; } #plugin-surface { height:100%; overflow:auto; padding:12px; } .workspace-leaf-content { min-height:100%; } .view-header:empty { display:none; } .view-content { min-height:100%; } button,input,select,textarea { font:inherit; color:inherit; } button { cursor:pointer; padding:6px 10px; border:1px solid var(--background-modifier-border); border-radius:5px; background:var(--interactive-normal); } .setting-item { display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--background-modifier-border); } .setting-item-info { flex:1; } .setting-item-description { font-size:12px; color:var(--text-muted); } .setting-item-control { max-width:50%; } input,select,textarea { max-width:100%; } .modal { position:fixed; inset:20px 10px; padding:20px; background:var(--background-primary); border:1px solid var(--background-modifier-border); border-radius:8px; overflow:auto; z-index:100; } .modal-close-button { position:absolute; right:8px; top:8px; }
</style>
</head>
<body>
  <script src="./runtime.bundle.js"></script>
</body>
</html>

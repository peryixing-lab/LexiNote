name: 功能建议
description: 提出新功能、体验改进或较大改动的设计提案。
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请先描述使用场景和要解决的问题，再说明建议的方案。
        较大的架构调整、第三方集成或数据格式变更，建议先讨论范围，再开始实现。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 谁会在什么场景下遇到什么困难？当前流程有什么不足？
      placeholder: 例如：整理同一项目的多篇笔记时，需要逐篇导出，希望能按项目批量导出。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述用户如何操作、最终得到什么结果，以及第一版需要支持的范围。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收方式
      description: 给出一两个可验证的例子，说明什么结果表示这个问题已得到解决。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与影响（可选）
      description: 可说明现有解决办法、考虑过的其他方案，以及对本地数据、权限、网络或设备兼容性的影响。
  - type: textarea
    id: references
    attributes:
      label: 参考资料或已有实现（可选）
      description: 可附设计图、相关 Issue、参考链接或分支。已有实现请说明已完成、未完成的部分和验证环境。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索已有 Issue；如有相关提案，已在描述中提供链接。
          required: true
        - label: 我已检查文字及附件，去除了个人笔记、密钥、签名材料和其他敏感信息。
          required: true
